spring:
  application:
    name: TallerAPI

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET}

jwt:
  secret: ${JWT_SECRET:bXlzZWNyZXRrZXlzZWNyZXRrZXlzZWNyZXRrZXlzZWNyZXRrZXlzZWNyZXRrZXlzZWNyZXRr}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}